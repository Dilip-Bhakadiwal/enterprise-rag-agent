name: CI/CD — Eval Gate → Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 */36 * * *"   # keep-alive ping every 36 hours

# ── Permissions ────────────────────────────────────────────────────────────
permissions:
  contents: read

# ── Jobs ───────────────────────────────────────────────────────────────────
jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Job 1: Run evaluation suite (CI gate)
  # If this fails, the deploy job will NOT run.
  # ────────────────────────────────────────────────────────────────────────
  evaluate:
    name: Evaluation Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run evaluation suite
        env:
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY:      ${{ secrets.NVIDIA_API_KEY }}
          PINECONE_API_KEY:    ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: enterprise-rag-demo
          PINECONE_CLOUD:      aws
          PINECONE_REGION:     us-east-1
          LOG_LEVEL:           INFO
          RAGAS_EVAL_DELAY_SECONDS: "3"
          RAGAS_SCORE_THRESHOLD:    "0.6"
        run: |
          python eval/run_eval.py \
            --questions eval/test_questions.json \
            --output eval/results.json \
            --no-ragas

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results.json
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────
  # Job 2: Deploy to Hugging Face Spaces
  # Runs only if evaluate passes AND this is a push to main (not a PR).
  # ────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to HF Spaces
    runs-on: ubuntu-latest
    needs: evaluate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "ci@enterprise-rag-demo"
          git config user.name  "Enterprise RAG CI"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE_ID }}  # e.g. yourname/enterprise-rag
        run: |
          # Add HF Space as a git remote
          git remote add hf "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}"

          # Force-push to trigger a Spaces rebuild
          git push hf main --force

          echo "✅ Pushed to HF Space: ${HF_SPACE}"

  # ────────────────────────────────────────────────────────────────────────
  # Job 3: Keep-alive ping (runs on schedule to prevent HF sleep)
  # Fires every 36 hours so the Space never crosses the 48-hour idle limit.
  # ────────────────────────────────────────────────────────────────────────
  keepalive:
    name: Keep-alive Ping
    runs-on: ubuntu-latest
    # This job is triggered separately by the schedule below
    if: github.event_name == 'schedule'
    steps:
      - name: Ping HF Space health endpoint
        env:
          HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}  # e.g. https://yourname-enterprise-rag.hf.space
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${HF_SPACE_URL}/health")
          echo "Health check status: ${STATUS}"
          if [ "$STATUS" != "200" ]; then
            echo "⚠️  Health check returned ${STATUS} — Space may be waking up"
          else
            echo "✅ Space is alive"
          fi


