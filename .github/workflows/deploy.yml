name: CI — Build & Code Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Job 1: Verify React 19 Frontend Build & TypeScript
  # ────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./react-frontend
        run: npm ci

      - name: Build React Production Bundle
        working-directory: ./react-frontend
        run: npm run build

  # ────────────────────────────────────────────────────────────────────────
  # Job 2: Verify Python 3.11 Backend Integrity
  # ────────────────────────────────────────────────────────────────────────
  backend-integrity:
    name: Backend Syntax & Imports Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Syntax Compilation
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/config.py
          python -m py_compile app/llm_clients.py
          python -m py_compile app/agent/graph.py
          python -m py_compile app/agent/router.py
          python -m py_compile app/agent/decomposer.py
          python -m py_compile app/agent/grader.py
          python -m py_compile app/agent/synthesizer.py
          python -m py_compile app/agent/rewriter.py
          python -m py_compile app/agent/retriever.py
          echo "✅ All backend modules compile with zero syntax errors."
